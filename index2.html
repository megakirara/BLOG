<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070720">
<title>KINOKO-BLOG</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg: #070720;
  --pink: #ff7ad9;
  --cyan: #4de1ff;
  --yellow: #ffe84a;
  --purple: #b68cff;
  --lime: #b6ff5c;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  color: #f8edff;
  background-color: var(--bg);
  background-image:
    linear-gradient(rgba(7, 7, 32, 0.40), rgba(7, 7, 32, 0.55)),
    url("files/neon_back.jpg");
  background-repeat: no-repeat, repeat;
  background-attachment: fixed, fixed;
  background-position: center, center;
  background-size: auto, 1111px auto;
  font-family:
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
  text-align: center;
}

#mycelium,
#spore-canvas,
#stars {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

#mycelium {
  z-index: 0;
  opacity: 0.3;
  background:
    radial-gradient(ellipse at 15% 25%, #642cff33, transparent 45%),
    radial-gradient(ellipse at 85% 65%, #ff36bd22, transparent 45%),
    radial-gradient(ellipse at 50% 90%, #00eaff1a, transparent 40%);
  animation: myceliumGlow 9s ease-in-out infinite alternate;
}

#spore-canvas {
  z-index: 1;
}

#stars {
  z-index: 1;
}

@keyframes myceliumGlow {
  from { opacity: 0.18; }
  to { opacity: 0.48; }
}

main {
  position: relative;
  z-index: 2;
  width: min(1040px, 94%);
  margin: 0 auto;
  padding: 55px 0 65px;
}

.big-frame {
  padding: 36px 34px 40px;
  border: 2px solid #ff7ad9;
  border-radius: 24px;
  background: rgba(8, 6, 32, 0.25);
  box-shadow:
    0 0 15px #ff7ad988,
    0 0 35px #ff3dc844,
    inset 0 0 25px #b68cff33;
  backdrop-filter: blur(3px);
  animation: fadeIn 1.6s ease;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(24px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

h1 {
  margin: 0 0 28px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.title-link {
  display: inline-block;
  text-decoration: none;
  transition: transform 0.2s ease;
}

.title-link:hover {
  transform: scale(1.03);
}

.neon-nikki-title {
  max-width: 100%;
  height: auto;
  max-height: 120px;
  object-fit: contain;
  animation: neonPulseGlow 12s ease-in-out infinite alternate;
}

@keyframes neonPulseGlow {
  0% {
    filter:
      drop-shadow(0 0 6px #fff)
      drop-shadow(0 0 16px #ff7ad9)
      drop-shadow(0 0 32px #ff3dc8)
      drop-shadow(0 0 50px rgba(255, 61, 200, 0.6));
    opacity: 1;
  }
  10% {
    filter:
      drop-shadow(0 0 2px #fff)
      drop-shadow(0 0 8px #ff7ad9)
      drop-shadow(0 0 16px rgba(255, 61, 200, 0.4));
    opacity: 0.82;
  }
  25% {
    filter:
      drop-shadow(0 0 6px #fff)
      drop-shadow(0 0 16px #4de1ff)
      drop-shadow(0 0 32px #00eaff)
      drop-shadow(0 0 50px rgba(0, 234, 255, 0.6));
    opacity: 1;
  }
  35% {
    filter:
      drop-shadow(0 0 2px #fff)
      drop-shadow(0 0 8px #4de1ff)
      drop-shadow(0 0 16px rgba(0, 234, 255, 0.4));
    opacity: 0.82;
  }
  50% {
    filter:
      drop-shadow(0 0 6px #fff)
      drop-shadow(0 0 16px #b6ff5c)
      drop-shadow(0 0 32px #82ff28)
      drop-shadow(0 0 50px rgba(130, 255, 40, 0.6));
    opacity: 1;
  }
  60% {
    filter:
      drop-shadow(0 0 2px #fff)
      drop-shadow(0 0 8px #b6ff5c)
      drop-shadow(0 0 16px rgba(130, 255, 40, 0.4));
    opacity: 0.82;
  }
  75% {
    filter:
      drop-shadow(0 0 6px #fff)
      drop-shadow(0 0 16px #ffe84a)
      drop-shadow(0 0 32px #ffcc00)
      drop-shadow(0 0 50px rgba(255, 204, 0, 0.6));
    opacity: 1;
  }
  85% {
    filter:
      drop-shadow(0 0 2px #fff)
      drop-shadow(0 0 8px #ffe84a)
      drop-shadow(0 0 16px rgba(255, 204, 0, 0.4));
    opacity: 0.82;
  }
  100% {
    filter:
      drop-shadow(0 0 6px #fff)
      drop-shadow(0 0 16px #b68cff)
      drop-shadow(0 0 32px #924dff)
      drop-shadow(0 0 50px rgba(146, 77, 255, 0.6));
    opacity: 1;
  }
}

.message {
  margin: 10px 0;
  color: #e7dcff;
  font-weight: bold;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

.message.is-error {
  color: #ff7a7a;
  text-shadow: 0 0 10px #ff7a7a88;
}

#posts-container {
  display: grid;
  gap: 26px;
  text-align: left;
}

.post-card {
  --card-color: #62f7ff;
  padding: 26px 28px;
  border: 2px solid var(--card-color);
  border-radius: 16px;
  background: rgba(8, 8, 32, 0.45);
  box-shadow:
    0 0 12px color-mix(in srgb, var(--card-color) 60%, transparent),
    inset 0 0 15px color-mix(in srgb, var(--card-color) 20%, transparent);
  backdrop-filter: blur(2px);
  transition:
    transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275),
    box-shadow 0.3s ease;
}

.post-card:hover {
  transform: translateY(-4px);
  box-shadow:
    0 0 20px var(--card-color),
    0 0 35px color-mix(in srgb, var(--card-color) 60%, transparent);
}

.post-card:nth-child(6n + 1) { --card-color: #62f7ff; }
.post-card:nth-child(6n + 2) { --card-color: #b6ff5c; }
.post-card:nth-child(6n + 3) { --card-color: #b68cff; }
.post-card:nth-child(6n + 4) { --card-color: #ffb85c; }
.post-card:nth-child(6n + 5) { --card-color: #ffe84a; }
.post-card:nth-child(6n + 6) { --card-color: #ff7a7a; }

.post-date {
  margin: 0 0 8px;
  color: var(--yellow);
  font-family: monospace;
  font-size: 0.85rem;
  letter-spacing: 0.1em;
  text-shadow: 0 0 8px #ffe84a66;
}

.post-card h3 {
  margin: 0 0 16px;
  color: #fff;
  font-size: 1.3rem;
  line-height: 1.5;
  overflow-wrap: anywhere;
  text-shadow: 0 0 12px var(--card-color);
}

.image-button {
  display: block;
  max-width: 100%;
  margin: 0 auto 16px;
  padding: 0;
  border: 1px solid color-mix(in srgb, var(--card-color) 60%, transparent);
  border-radius: 10px;
  background: none;
  line-height: 0;
  overflow: hidden;
  cursor: zoom-in;
  transition: box-shadow 0.2s ease, transform 0.2s ease;
}

.image-button:hover,
.image-button:focus-visible {
  box-shadow: 0 0 16px var(--card-color);
  outline: none;
}

.image-button:active {
  transform: scale(0.99);
}

.image-button img,
.lightbox-image {
  display: block;
  max-width: 100%;
  height: auto;
  pointer-events: none;
  -webkit-user-drag: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

.image-button img {
  max-height: 620px;
  margin: 0 auto;
  object-fit: contain;
}

.post-content {
  margin: 0;
  color: #f0eaff;
  font-size: 1.02rem;
  line-height: 1.95;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.lightbox {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 16px;
  background: rgba(5, 3, 18, 0.92);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  opacity: 0;
  visibility: hidden;
  cursor: zoom-out;
  transition: opacity 0.25s ease, visibility 0.25s ease;
}

.lightbox.is-open {
  opacity: 1;
  visibility: visible;
}

.lightbox-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: 100%;
  transform: scale(0.96);
  transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.lightbox.is-open .lightbox-content {
  transform: scale(1);
}

.lightbox-image {
  max-width: 96vw;
  max-height: calc(100vh - 130px);
  border-radius: 6px;
  box-shadow:
    0 0 12px rgba(255, 255, 255, 0.12),
    0 0 40px rgba(255, 105, 232, 0.25),
    0 0 90px rgba(105, 234, 255, 0.14);
}

.lightbox-caption {
  margin: 16px 0 0;
  color: #f5eaff;
  font-size: 0.95rem;
  letter-spacing: 0.1em;
  text-shadow: 0 0 12px var(--pink);
  overflow-wrap: anywhere;
}

.lightbox-hint {
  margin: 8px 0 0;
  color: #a99bc8;
  font-size: 0.7rem;
  letter-spacing: 0.2em;
}

@media (max-width: 600px) {
  main {
    padding-top: 25px;
  }

  .big-frame {
    padding: 24px 14px 28px;
  }

  .post-card {
    padding: 18px 14px;
  }

  .post-card h3 {
    font-size: 1.15rem;
  }

  .neon-nikki-title {
    max-height: 90px;
  }

  .lightbox {
    padding: 30px 8px;
  }
}

@media print {
  .image-button,
  .lightbox {
    display: none !important;
  }
}
</style>
</head>

<body>
<div id="mycelium" aria-hidden="true"></div>
<div id="stars" aria-hidden="true"></div>
<canvas id="spore-canvas" aria-hidden="true"></canvas>

<main>
  <section class="big-frame">
    <h1>
      <a href="https://megakirara.github.io/-KINOKO/" class="title-link">
        <img src="files/nikki.png" alt="KINOKO-BLOG 日記" class="neon-nikki-title">
      </a>
    </h1>

    <div id="posts-container" aria-live="polite">
      <p class="message">読み込み中... ⏳</p>
    </div>
  </section>
</main>

<div
  class="lightbox"
  id="lightbox"
  role="dialog"
  aria-modal="true"
  aria-label="画像の拡大表示（クリックで閉じる）"
  aria-hidden="true"
>
  <div class="lightbox-content">
    <img class="lightbox-image" id="lightbox-image" alt="" draggable="false">
    <p class="lightbox-caption" id="lightbox-caption"></p>
    <p class="lightbox-hint">CLICK TO CLOSE</p>
  </div>
</div>

<script>
"use strict";

const SUPABASE_URL = 'https://oqfqpzslduwynckdpqqx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_1O773HFiGqD8A3FOKj5dSA_K2hVYUMh';

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const container = document.getElementById('posts-container');

function showMessage(text, isError) {
  const p = document.createElement('p');
  p.className = 'message' + (isError ? ' is-error' : '');
  p.textContent = text;
  container.replaceChildren(p);
}

function sortNewestFirst(posts) {
  const list = [...posts];

  if (list.some((post) => post.created_at)) {
    list.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
  } else if (list.some((post) => post.id !== undefined && post.id !== null)) {
    list.sort((a, b) => (a.id < b.id ? 1 : a.id > b.id ? -1 : 0));
  }

  return list;
}

function formatDate(value) {
  if (!value) return '';

  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return '';

  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');

  return `${y}.${m}.${d}`;
}

function safeImageUrl(url) {
  try {
    const parsed = new URL(url);
    return parsed.protocol === 'https:' || parsed.protocol === 'http:'
      ? parsed.href
      : null;
  } catch (error) {
    return null;
  }
}

function buildPostCard(post) {
  const card = document.createElement('article');
  card.className = 'post-card';

  const dateText = formatDate(post.created_at);

  if (dateText) {
    const date = document.createElement('p');
    date.className = 'post-date';
    date.textContent = dateText;
    card.appendChild(date);
  }

  const title = document.createElement('h3');
  title.textContent = post.title || '';
  card.appendChild(title);

  const imageUrl = post.image_url ? safeImageUrl(post.image_url) : null;

  if (imageUrl) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'image-button';
    button.setAttribute('aria-label', (post.title || '画像') + ' を拡大表示');

    const img = document.createElement('img');
    img.src = imageUrl;
    img.alt = '';
    img.loading = 'lazy';
    img.draggable = false;

    img.addEventListener('error', () => {
      button.remove();
    });

    button.appendChild(img);

    button.addEventListener('click', () => {
      openLightbox(imageUrl, post.title || '', button);
    });

    card.appendChild(button);
  }

  const content = document.createElement('p');
  content.className = 'post-content';
  content.textContent = post.content || '';
  card.appendChild(content);

  return card;
}

async function fetchPosts() {
  const { data: posts, error } = await supabaseClient
    .from('posts')
    .select('*')
    .or('is_published.is.null,is_published.eq.true');

  if (error) {
    showMessage('❌ データの取得に失敗しました: ' + error.message, true);
    return;
  }

  if (!posts || posts.length === 0) {
    showMessage('まだ投稿がありません。', false);
    return;
  }

  const fragment = document.createDocumentFragment();

  sortNewestFirst(posts).forEach((post) => {
    fragment.appendChild(buildPostCard(post));
  });

  container.replaceChildren(fragment);
}

fetchPosts();

const lightbox = document.getElementById('lightbox');
const lightboxImage = document.getElementById('lightbox-image');
const lightboxCaption = document.getElementById('lightbox-caption');

let lastFocusedElement = null;

function openLightbox(url, caption, sourceButton) {
  lastFocusedElement = sourceButton;

  lightboxImage.src = url;
  lightboxCaption.textContent = caption;

  lightbox.classList.add('is-open');
  lightbox.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  lightbox.classList.remove('is-open');
  lightbox.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';

  if (lastFocusedElement) {
    lastFocusedElement.focus({ preventScroll: true });
  }
}

lightbox.addEventListener('click', closeLightbox);

document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && lightbox.classList.contains('is-open')) {
    closeLightbox();
  }
});

document.addEventListener('contextmenu', (event) => {
  if (event.target.closest('.image-button, .lightbox')) {
    event.preventDefault();
  }
});

document.addEventListener('dragstart', (event) => {
  if (event.target.tagName === 'IMG') {
    event.preventDefault();
  }
});

(() => {
  const canvas = document.getElementById("spore-canvas");
  const ctx = canvas.getContext("2d");

  if (!ctx) return;

  let width = 0;
  let height = 0;
  let spores = [];
  let mouseX = 0;
  let mouseY = 0;

  const colors = [
    "#ff7ad9",
    "#4de1ff",
    "#ffe84a",
    "#b68cff",
    "#b6ff5c"
  ];

  function resize() {
    const ratio = Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

    const count = Math.min(
      180,
      Math.max(60, Math.floor((width * height) / 8500))
    );

    spores = Array.from({ length: count }, () => createSpore(true));
  }

  function createSpore(randomY = false) {
    return {
      x: Math.random() * width,
      y: randomY ? Math.random() * height : height + 10,
      size: Math.random() * 2.1 + 0.5,
      speed: Math.random() * 0.55 + 0.12,
      drift: (Math.random() - 0.5) * 0.45,
      alpha: Math.random() * 0.65 + 0.2,
      color: colors[Math.floor(Math.random() * colors.length)],
      phase: Math.random() * Math.PI * 2
    };
  }

  function animate() {
    ctx.clearRect(0, 0, width, height);

    for (const spore of spores) {
      spore.phase += 0.015;
      spore.x += spore.drift + Math.sin(spore.phase) * 0.12;
      spore.y -= spore.speed;

      if (spore.y < -10) {
        Object.assign(spore, createSpore(false));
      }

      if (spore.x < -10) spore.x = width + 10;
      if (spore.x > width + 10) spore.x = -10;

      const parallaxX = mouseX * 0.012;
      const parallaxY = mouseY * 0.012;

      ctx.globalAlpha = spore.alpha;
      ctx.fillStyle = spore.color;
      ctx.shadowBlur = 8;
      ctx.shadowColor = spore.color;

      ctx.beginPath();
      ctx.arc(
        spore.x + parallaxX,
        spore.y + parallaxY,
        spore.size,
        0,
        Math.PI * 2
      );
      ctx.fill();
    }

    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    requestAnimationFrame(animate);
  }

  window.addEventListener("resize", resize, { passive: true });

  window.addEventListener("mousemove", (event) => {
    mouseX = event.clientX - width / 2;
    mouseY = event.clientY - height / 2;
  }, { passive: true });

  resize();
  animate();
})();

(() => {
  const starContainer = document.getElementById("stars");
  const fragment = document.createDocumentFragment();

  for (let i = 0; i < 50; i++) {
    const star = document.createElement("span");

    star.textContent = "✦";
    star.setAttribute("aria-hidden", "true");

    Object.assign(star.style, {
      position: "absolute",
      left: Math.random() * 100 + "%",
      top: Math.random() * 100 + "%",
      color: i % 2 ? "#4de1ff" : "#ff7ad9",
      fontSize: Math.random() * 9 + 5 + "px",
      opacity: String(Math.random() * 0.55 + 0.12),
      textShadow: "0 0 8px currentColor",
      animation: `starBlink ${Math.random() * 3 + 2}s ease-in-out infinite alternate`,
      animationDelay: Math.random() * -5 + "s"
    });

    fragment.appendChild(star);
  }

  const style = document.createElement("style");
  style.textContent = `
    @keyframes starBlink {
      from { opacity: 0.12; }
      to { opacity: 0.85; }
    }
  `;

  document.head.appendChild(style);
  starContainer.appendChild(fragment);
})();

document.addEventListener("click", (event) => {
  const colors = ["#ff7ad9", "#4de1ff", "#ffe84a", "#b68cff"];

  for (let i = 0; i < 6; i++) {
    const spark = document.createElement("span");
    const angle = Math.PI * 2 * i / 6;
    const distance = 18 + Math.random() * 24;

    spark.textContent = "✦";

    Object.assign(spark.style, {
      position: "fixed",
      left: event.clientX + "px",
      top: event.clientY + "px",
      zIndex: "199",
      pointerEvents: "none",
      color: colors[i % colors.length],
      fontSize: "13px",
      textShadow: "0 0 8px currentColor",
      transition: "transform 550ms ease-out, opacity 550ms ease-out"
    });

    document.body.appendChild(spark);

    requestAnimationFrame(() => {
      spark.style.transform =
        `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px)`;
      spark.style.opacity = "0";
    });

    window.setTimeout(() => spark.remove(), 650);
  }
});

(() => {
  const title = document.querySelector("h1");
  const colors = ["#ff65c3", "#b6ff5c", "#62f7ff", "#b68cff", "#ffb85c", "#ffe84a"];
  const marks = ["✦", "✧", "✨"];

  function sparkle() {
    const rect = title.getBoundingClientRect();
    const spark = document.createElement("span");

    spark.textContent = marks[Math.floor(Math.random() * marks.length)];

    Object.assign(spark.style, {
      position: "fixed",
      left: rect.left + Math.random() * rect.width + "px",
      top: rect.top + Math.random() * rect.height + "px",
      zIndex: "99",
      pointerEvents: "none",
      color: colors[Math.floor(Math.random() * colors.length)],
      fontSize: 9 + Math.random() * 10 + "px",
      textShadow: "0 0 8px currentColor",
      opacity: "1",
      transition: "transform 750ms ease-out, opacity 750ms ease-out"
    });

    document.body.appendChild(spark);

    requestAnimationFrame(() => {
      const dx = (Math.random() - 0.5) * 44;
      const dy = -(18 + Math.random() * 32);
      const rot = (Math.random() - 0.5) * 180;
      spark.style.transform =
        `translate(${dx}px, ${dy}px) rotate(${rot}deg) scale(0.4)`;
      spark.style.opacity = "0";
    });

    window.setTimeout(() => spark.remove(), 800);
  }

  let timer = null;

  title.addEventListener("mouseenter", () => {
    if (timer) return;
    sparkle();
    timer = window.setInterval(sparkle, 90);
  });

  title.addEventListener("mouseleave", () => {
    window.clearInterval(timer);
    timer = null;
  });
})();
</script>
</body>
</html>
