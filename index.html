<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070720">
<title>🍄 ( ´ᯅ` ) のひみつ日記 🪐</title>

<style>
:root {
  --bg: #070720;
  --pink: #ff7ad9;
  --cyan: #4de1ff;
  --yellow: #ffe84a;
  --purple: #b68cff;
  --lime: #b6ff5c;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background-color: var(--bg);
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  color: #f8edff;
  background-color: var(--bg);
  font-family:
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
  text-align: center;
}

a {
  color: inherit;
}

#background-image {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-color: var(--bg);
  background-image:
    linear-gradient(rgba(7, 7, 32, 0.30), rgba(7, 7, 32, 0.40)),
    url("files/neon_back.jpg");
  background-repeat: no-repeat, repeat;
  background-attachment: fixed, fixed;
  background-position: center, center;
  background-size: auto, 888px auto;
}

#mycelium,
#spore-canvas,
#stars {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

#mycelium {
  z-index: 0;
  opacity: 0.3;
  background:
    radial-gradient(ellipse at 15% 25%, #642cff33, transparent 45%),
    radial-gradient(ellipse at 85% 65%, #ff36bd22, transparent 45%),
    radial-gradient(ellipse at 50% 90%, #00eaff1a, transparent 40%);
  animation: myceliumGlow 9s ease-in-out infinite alternate;
}

#spore-canvas, #stars {
  z-index: 1;
}

@keyframes myceliumGlow {
  from { opacity: 0.18; }
  to { opacity: 0.48; }
}

main {
  position: relative;
  z-index: 2;
  width: min(800px, 92%);
  margin: 0 auto;
  padding: 55px 0 65px;
}

.big-frame {
  padding: 36px 26px 38px;
  border: 2px solid #ff7ad9;
  border-radius: 24px;
  background: rgba(8, 6, 32, 0.25);
  box-shadow:
    0 0 15px #ff7ad988,
    0 0 35px #ff3dc844,
    inset 0 0 25px #b68cff33;
  backdrop-filter: blur(3px);
  animation: fadeIn 1.6s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: translateY(0); }
}

h1 {
  margin: 0 0 10px;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* タイトル画像のぼわぁ〜んネオン発光 */
.header-img {
  max-width: 100%;
  height: auto;
  max-height: 120px;
  object-fit: contain;
  animation: ultraSoftRainbowNeon 80s infinite ease-in-out;
}

@keyframes ultraSoftRainbowNeon {
  0%, 100% {
    filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 18px #ff7ad9) drop-shadow(0 0 32px #ff3dc8);
    opacity: 0.95;
  }
  20% {
    filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 18px #4de1ff) drop-shadow(0 0 32px #00eaff);
    opacity: 0.9;
  }
  40% {
    filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 18px #b6ff5c) drop-shadow(0 0 32px #82ff28);
    opacity: 0.95;
  }
  60% {
    filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 18px #ffe84a) drop-shadow(0 0 32px #ffcc00);
    opacity: 0.9;
  }
  80% {
    filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 18px #b68cff) drop-shadow(0 0 32px #924dff);
    opacity: 0.95;
  }
}

.sub-title {
  color: var(--cyan);
  font-size: 0.95rem;
  letter-spacing: 0.08em;
  margin-bottom: 28px;
  text-shadow: 0 0 8px #4de1ff88;
}

/* --- 日記投稿フォーム --- */
.diary-form {
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin-bottom: 40px;
  text-align: left;
}

.input-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.input-label {
  color: var(--pink);
  font-size: 0.9rem;
  font-weight: bold;
  text-shadow: 0 0 6px var(--pink);
}

.diary-input, .diary-textarea {
  width: 100%;
  padding: 14px 16px;
  border: 1.5px solid var(--purple);
  border-radius: 12px;
  background: rgba(8, 8, 32, 0.65);
  color: #f8edff;
  font-size: 1rem;
  font-family: inherit;
  outline: none;
  box-shadow: inset 0 0 10px rgba(182, 140, 255, 0.15);
  transition: border-color 0.2s, box-shadow 0.2s;
}

.diary-input:focus, .diary-textarea:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 12px var(--cyan), inset 0 0 10px rgba(77, 225, 255, 0.2);
}

.diary-textarea {
  min-height: 120px;
  resize: vertical;
  line-height: 1.7;
}

.post-button {
  --btn-color: var(--lime);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 52px;
  padding: 12px;
  border: 2px solid var(--btn-color);
  border-radius: 12px;
  background: rgba(8, 8, 32, 0.75);
  color: #ffffff;
  font-size: 1.05rem;
  font-weight: bold;
  letter-spacing: 0.06em;
  cursor: pointer;
  text-shadow: 0 0 8px var(--btn-color);
  box-shadow:
    0 0 10px color-mix(in srgb, var(--btn-color) 50%, transparent),
    inset 0 0 8px color-mix(in srgb, var(--btn-color) 25%, transparent);
  transition: transform 0.2s, box-shadow 0.2s, background 0.2s, color 0.2s;
}

.post-button:hover {
  color: #070720;
  background: var(--btn-color);
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 0 18px var(--btn-color), 0 0 32px var(--btn-color);
}

/* --- 投稿ログ（一覧） --- */
.diary-list {
  display: flex;
  flex-direction: column;
  gap: 20px;
  text-align: left;
}

.diary-card {
  padding: 20px;
  border: 1.5px solid var(--purple);
  border-radius: 16px;
  background: rgba(8, 8, 32, 0.45);
  box-shadow: 0 0 12px rgba(182, 140, 255, 0.2);
  backdrop-filter: blur(2px);
  position: relative;
  animation: fadeIn 0.8s ease;
}

.diary-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px dashed #b68cff55;
  padding-bottom: 8px;
  margin-bottom: 12px;
}

.diary-date {
  color: var(--yellow);
  font-size: 0.85rem;
  font-weight: bold;
  text-shadow: 0 0 6px #ffe84a88;
}

.diary-delete-btn {
  background: none;
  border: none;
  color: #ff7ad9aa;
  cursor: pointer;
  font-size: 0.85rem;
  transition: color 0.2s;
}

.diary-delete-btn:hover {
  color: #ff3dc8;
}

.diary-card-title {
  color: #ffffff;
  font-size: 1.15rem;
  margin: 0 0 8px;
  text-shadow: 0 0 8px var(--cyan);
}

.diary-card-body {
  color: #f0eaff;
  font-size: 0.95rem;
  line-height: 1.8;
  white-space: pre-wrap;
  word-break: break-all;
}

.no-diary {
  color: #b68cffaa;
  text-align: center;
  padding: 30px 0;
  font-style: italic;
}

.back-link {
  display: inline-block;
  margin-top: 36px;
  padding: 10px 22px;
  border: 1.5px solid var(--purple);
  border-radius: 20px;
  color: #d8b4fe;
  text-decoration: none;
  background: rgba(8, 8, 32, 0.5);
  box-shadow: 0 0 10px #b68cff44;
  transition: transform 0.2s, color 0.2s, background 0.2s, box-shadow 0.2s;
}

.back-link:hover {
  color: white;
  background: rgba(182, 140, 255, 0.3);
  transform: translateY(-2px);
  box-shadow: 0 0 15px var(--purple);
}

@media (max-width: 600px) {
  main { padding-top: 25px; }
  .big-frame { padding: 26px 16px 28px; }
  .header-img { max-height: 90px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<body>
<div id="background-image" aria-hidden="true"></div>
<div id="mycelium" aria-hidden="true"></div>
<div id="stars" aria-hidden="true"></div>
<canvas id="spore-canvas" aria-hidden="true"></canvas>

<main>
  <section class="big-frame">
    <!-- ヘッダー（タイトル画像が無い場合はテキストを表示） -->
    <h1>
      <img src="files/kinoko_dosei.png" alt="ひみつ日記" class="header-img" onerror="this.outerHTML='<span style=\'font-size:2rem;color:#ffe3f7;\'>🍄( ´ᯅ` )日記🪐</span>'">
    </h1>
    <p class="sub-title">役に立つものは、たぶん書かれません。( ´ᯅ` )</p>

    <!-- 投稿フォーム -->
    <form class="diary-form" id="diaryForm">
      <div class="input-group">
        <label class="input-label" for="diaryTitle">✦ タイトル</label>
        <input type="text" id="diaryTitle" class="diary-input" placeholder="今日のふと思ったこと…" required>
      </div>
      
      <div class="input-group">
        <label class="input-label" for="diaryContent">✦ 本文</label>
        <textarea id="diaryContent" class="diary-textarea" placeholder="ここに思いついた順に書いてね🍄" required></textarea>
      </div>

      <button type="submit" class="post-button">🍄 庭に生やす（投稿）</button>
    </form>

    <!-- 日記一覧 -->
    <div class="diary-list" id="diaryList">
      <!-- ここに投稿した日記が自動で並ぶよ -->
    </div>

    <div>
      <a href="index.html" class="back-link">🍄 帰る</a>
    </div>
  </section>
</main>

<script>
"use strict";

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// 背景の胞子パーティクル
(() => {
  const canvas = document.getElementById("spore-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  if (!ctx) return;

  let width = 0, height = 0, spores = [], mouseX = 0, mouseY = 0;
  const colors = ["#ff7ad9", "#4de1ff", "#ffe84a", "#b68cff", "#b6ff5c"];

  function resize() {
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

    const count = Math.min(180, Math.max(60, Math.floor((width * height) / 8500)));
    spores = Array.from({ length: count }, () => createSpore(true));
  }

  function createSpore(randomY = false) {
    return {
      x: Math.random() * width,
      y: randomY ? Math.random() * height : height + 10,
      size: Math.random() * 2.1 + 0.5,
      speed: Math.random() * 0.55 + 0.12,
      drift: (Math.random() - 0.5) * 0.45,
      alpha: Math.random() * 0.65 + 0.2,
      color: colors[Math.floor(Math.random() * colors.length)],
      phase: Math.random() * Math.PI * 2
    };
  }

  function animate() {
    ctx.clearRect(0, 0, width, height);
    for (const spore of spores) {
      spore.phase += 0.015;
      spore.x += spore.drift + Math.sin(spore.phase) * 0.12;
      spore.y -= spore.speed;
      if (spore.y < -10) Object.assign(spore, createSpore(false));
      if (spore.x < -10) spore.x = width + 10;
      if (spore.x > width + 10) spore.x = -10;

      ctx.globalAlpha = spore.alpha;
      ctx.fillStyle = spore.color;
      ctx.shadowBlur = 8;
      ctx.shadowColor = spore.color;
      ctx.beginPath();
      ctx.arc(spore.x + mouseX * 0.012, spore.y + mouseY * 0.012, spore.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    requestAnimationFrame(animate);
  }

  window.addEventListener("resize", resize, { passive: true });
  window.addEventListener("mousemove", (e) => {
    mouseX = e.clientX - width / 2;
    mouseY = e.clientY - height / 2;
  }, { passive: true });

  resize();
  if (!reduceMotion) animate();
})();

// 背景の星配置
(() => {
  const container = document.getElementById("stars");
  if (!container) return;
  const fragment = document.createDocumentFragment();

  for (let i = 0; i < 50; i++) {
    const star = document.createElement("span");
    star.textContent = "✦";
    star.setAttribute("aria-hidden", "true");
    Object.assign(star.style, {
      position: "absolute",
      left: Math.random() * 100 + "%",
      top: Math.random() * 100 + "%",
      color: i % 2 ? "#4de1ff" : "#ff7ad9",
      fontSize: Math.random() * 9 + 5 + "px",
      opacity: String(Math.random() * 0.55 + 0.12),
      textShadow: "0 0 8px currentColor",
      animation: `starBlink ${Math.random() * 3 + 2}s ease-in-out infinite alternate`,
      animationDelay: Math.random() * -5 + "s"
    });
    fragment.appendChild(star);
  }

  const style = document.createElement("style");
  style.textContent = `@keyframes starBlink { from { opacity: 0.12; } to { opacity: 0.85; } }`;
  document.head.appendChild(style);
  container.appendChild(fragment);
})();

// クリック時の星弾け
document.addEventListener("click", (event) => {
  if (reduceMotion) return;
  const colors = ["#ff7ad9", "#4de1ff", "#ffe84a", "#b68cff"];
  for (let i = 0; i < 6; i++) {
    const spark = document.createElement("span");
    const angle = Math.PI * 2 * i / 6;
    const distance = 18 + Math.random() * 24;
    spark.textContent = "✦";
    Object.assign(spark.style, {
      position: "fixed",
      left: event.clientX + "px",
      top: event.clientY + "px",
      zIndex: "99",
      pointerEvents: "none",
      color: colors[i % colors.length],
      fontSize: "13px",
      textShadow: "0 0 8px currentColor",
      transition: "transform 550ms ease-out, opacity 550ms ease-out"
    });
    document.body.appendChild(spark);
    requestAnimationFrame(() => {
      spark.style.transform = `translate(${Math.cos(angle) * distance}px,${Math.sin(angle) * distance}px)`;
      spark.style.opacity = "0";
    });
    window.setTimeout(() => spark.remove(), 650);
  }
});

// オンマウスキラキラ
(() => {
  if (reduceMotion) return;
  const colors = ["#ff65c3", "#b6ff5c", "#62f7ff", "#b68cff", "#ffb85c", "#ffe84a"];
  const marks = ["✦", "✧", "✨"];

  function sparkle(element) {
    const rect = element.getBoundingClientRect();
    const spark = document.createElement("span");
    spark.textContent = marks[Math.floor(Math.random() * marks.length)];
    Object.assign(spark.style, {
      position: "absolute",
      left: rect.left + Math.random() * rect.width + "px",
      top: rect.top + Math.random() * rect.height + "px",
      zIndex: "99",
      pointerEvents: "none",
      color: colors[Math.floor(Math.random() * colors.length)],
      fontSize: 9 + Math.random() * 10 + "px",
      textShadow: "0 0 8px currentColor",
      opacity: "1",
      transition: "transform 750ms ease-out, opacity 750ms ease-out"
    });
    document.body.appendChild(spark);
    requestAnimationFrame(() => {
      spark.style.transform = `translate(${(Math.random() - 0.5) * 44}px, ${-(18 + Math.random() * 32)}px) rotate(${(Math.random() - 0.5) * 180}deg) scale(0.4)`;
      spark.style.opacity = "0";
    });
    window.setTimeout(() => spark.remove(), 800);
  }

  document.addEventListener("mouseover", (e) => {
    const target = e.target.closest("h1, .post-button, .back-link");
    if (target && !target.dataset.sparkling) {
      target.dataset.sparkling = "true";
      sparkle(target);
      const timer = setInterval(() => sparkle(target), 120);
      target.addEventListener("mouseleave", () => {
        clearInterval(timer);
        delete target.dataset.sparkling;
      }, { once: true });
    }
  });
})();

// --- 日記保存・読み込みロジック (LocalStorage) ---
(() => {
  const form = document.getElementById("diaryForm");
  const titleInput = document.getElementById("diaryTitle");
  const contentInput = document.getElementById("diaryContent");
  const diaryList = document.getElementById("diaryList");

  const STORAGE_KEY = "kinoko_secret_diaries";

  function getDiaries() {
    const data = localStorage.getItem(STORAGE_KEY);
    return data ? JSON.parse(data) : [];
  }

  function saveDiaries(diaries) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(diaries));
  }

  function renderDiaries() {
    const diaries = getDiaries();
    diaryList.innerHTML = "";

    if (diaries.length === 0) {
      diaryList.innerHTML = `<div class="no-diary">まだ日記は生えていません🍄<br>上のフォームから投稿してみてね！</div>`;
      return;
    }

    diaries.forEach((diary, index) => {
      const card = document.createElement("div");
      card.className = "diary-card";
      card.innerHTML = `
        <div class="diary-card-header">
          <span class="diary-date">✦ ${diary.date}</span>
          <button class="diary-delete-btn" onclick="deleteDiary(${index})">✕ 抜く（削除）</button>
        </div>
        <h3 class="diary-card-title">${escapeHTML(diary.title)}</h3>
        <div class="diary-card-body">${escapeHTML(diary.content)}</div>
      `;
      diaryList.appendChild(card);
    });
  }

  function escapeHTML(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const title = titleInput.value.trim();
    const content = contentInput.value.trim();

    if (!title || !content) return;

    const now = new Date();
    const dateStr = `${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

    const diaries = getDiaries();
    diaries.unshift({ title, content, date: dateStr });
    saveDiaries(diaries);

    titleInput.value = "";
    contentInput.value = "";
    renderDiaries();
  });

  window.deleteDiary = function(index) {
    if (confirm("この日記を抜いて（削除して）もいい？")) {
      const diaries = getDiaries();
      diaries.splice(index, 1);
      saveDiaries(diaries);
      renderDiaries();
    }
  };

  renderDiaries();
})();
</script>
</body>
</html>
